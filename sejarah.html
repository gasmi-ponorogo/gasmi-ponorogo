        body {

        /* --- NAVBAR --- */
        .atas {
            display: flex;

        }


        .tombol-merah {
            background-color: #dd2222;
            color: #ffffff;
            padding: 12px 28px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
        }

        .tombol-merah:hover {
            background-color: #b91c1c;

        /* --- KOTAK BERITA TENGAH --- */
        .berita-tengah {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 3%;
            background-color: #f8f9ff;
            border-bottom-left-radius: 50% 15%;
            border-bottom-right-radius: 50% 15%;
        }


        .kotak-berita {
            width: 360px;
            height: 200px;
            background-color: #d0d0d0;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 50px;
            font-weight: bold;
            font-style: italic;
            color: #807e7e;            
            font-family: Monotype corsiva;
        }


        /* --- FOOTER UTAMA --- */
        .footer-utama {
            padding: 50px 3%;
            background-color: #ffffff;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 30px;
        }


        .footer-utama h3 {
            font-size: 24px;
            color: #222244;
            margin-bottom: 15px;
            font-weight: 600;
        }


        .footer-utama p {
            font-size: 16px;
            color: #444466;
            line-height: 1.7;
        }


        .medsos-teks {
            font-size: 17px;
            color: #444466;
            margin-bottom: 15px;
        }


        .medsos-ikon {
            display: flex;
            gap: 15px;
        }


        .medsos-ikon a {
            width: 42px;
            height: 42px;
            border: 1px solid #ddd;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #555;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .medsos-ikon a:hover {
            background-color: #dd2222;
            border-color: #dd2222;
            color: #fff;
            transform: translateY(-3px);
        }


        /* --- GARIS BAWAH GELAP --- */
        .footer-bawah {
            background-color: #222244;
            color: #ffffff;
            padding: 15px 3%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }


        .footer-bawah a {
            color: #ffffff;
            text-decoration: none;
            margin: 0 12px;
        }

        .footer-bawah a:hover {
            color: #ffcccc;
        }

        /* --- RESPONSIVE --- */
        @media (max-width: 900px) {
            .atas { flex-direction: column; text-align: center; }
            .nav-links { margin: 10px 0; }
            .footer-utama { flex-direction: column; }
