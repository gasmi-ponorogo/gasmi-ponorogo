    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffffff;
            color: #333;
            line-height: 1.8;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 5%;
        }

        /* --- BREADCRUMB --- */
        .breadcrumb {
            font-size: 15px;
            color: #777;
            margin-bottom: 30px;
        }

        .breadcrumb a {
            color: #e53935;
            text-decoration: none;
        }

        /* --- JUDUL YANG BISA DIKLIK --- */
        .judul-artikel {
            font-size: 32px;
            color: #252547;
            cursor: pointer;
            transition: color 0.3s ease;
            line-height: 1.4;
            margin-bottom: 30px;
            text-align: center;
        }

        .judul-artikel.sentuh {
            color: #e53935;
        }

        /* --- LAYAR PEMUATAN --- */
        #loading-artikel {
            position: fixed;
            inset: 0;
            background-color: rgba(255,255,255,0.95);
            z-index: 999;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .spinner {
            width: 45px;
            height: 45px;
            border: 5px solid #eee;
            border-top-color: #e53935;
            border-radius: 50%;
            animation: putar 0.8s linear infinite;
        }

        @keyframes putar {
            to { transform: rotate(360deg); }
        }

        /* --- ISI ARTIKEL --- */
        .isi-artikel {
            display: none;
            animation: muncul 0.6s ease-out;
        }

        @keyframes muncul {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .isi-artikel h2 {
            font-size: 24px;
            color: #252547;
            margin: 35px 0 15px;
        }

        .isi-artikel p {
            margin-bottom: 18px;
            text-align: justify;
        }

            margin-top: 50px;

            border-top: 1px solid #eee;
        }

        .bagikan h3 {
            font-size: 17px;
            margin-bottom: 15px;
            color: #444;
        }

        .tautan-bagi {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

            border-radius: 6px;
            color: #fff;
            text-decoration: none;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 7px;
        }
