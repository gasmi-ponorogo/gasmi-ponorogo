<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kantor Cabang - Gasmi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #333344;
            line-height: 1.6;
        }

        /* ===== Header & Navigasi ===== */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 24px 40px;
        }

        .logo {
            font-size: 32px;
            font-weight: 700;
            color: #222244;
            text-decoration: none;
        }

        nav {
            display: flex;
            gap: 40px;
            align-items: center;
        }

        nav a {
            font-size: 18px;
            color: #444455;
            text-decoration: none;
            padding: 6px 0;
            transition: all 0.2s;
        }

        nav a.active {
            color: #dd2222;
            font-weight: 600;
            border-bottom: 2px solid #dd2222;
        }

        .hubungi-btn {
            background-color: #dd2222;
            color: #ffffff;
            padding: 10px 26px;
            border-radius: 8px;
            font-size: 17px;
            font-weight: 600;
            text-decoration: none;
            border: none;
            cursor: pointer;
        }

        /* ===== Bagian Konten ===== */
        main {
            padding: 40px 40px 80px;
        }

        .page-title {
            text-align: center;
            font-size: 42px;
            color: #444466;
            margin-bottom: 50px;
            font-weight: 600;
        }

        .branch-card {
            width: 480px;
            padding: 45px 30px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.06);
            text-align: center;
            margin-bottom: 70px;
        }

        .location-icon {
            width: 40px;
            height: 40px;
            color: #dd2222;
            margin-bottom: 12px;
        }

        .branch-name {
            font-size: 20px;
            color: #333355;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .branch-type {
            font-size: 16px;
            color: #777788;
        }

        /* ===== Bagian Info & Kontak ===== */
        .info-section {
            background-color: #f8f8fc;
            padding: 40px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 40px;
        }

        .company-info h3 {
            font-size: 24px;
            color: #333344;
            margin-bottom: 16px;
        }

        .company-info p {
            font-size: 17px;
            color: #444455;
            line-height: 1.7;
        }

        .contact-block h3 {
            font-size: 24px;
            color: #333344;
            margin-bottom: 16px;
        }

        .contact-block p {
            font-size: 17px;
            color: #444455;
            margin-bottom: 6px;
        }

        .social-heading {
            margin-top: 28px;
            margin-bottom: 16px;
            font-size: 17px;
            color: #444455;
        }

        .social-icons {
            display: flex;
            gap: 14px;
        }

        /* ====================================== */
        /* ==== GAYA IKON SOSIAL SERAGAM ==== */
        /* ====================================== */
        .social-icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background-color: #ffffff;
            border: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: all 0.25s ease;
        }

        .social-icon svg {
            width: 20px;
            height: 20px;
            fill: #888899; /* Warna ikon default: abu-abu */
            transition: fill 0.25s ease;
        }

        /* ====================================== */
        /* ==== HOVER: LATAR PENUH BERWARNA ==== */
        /* ====================================== */

        /* Facebook: Latar biru penuh + ikon putih */
        .social-icon.fb:hover {
            background-color: #1877F2;
            border-color: #1877F2;
        }
        .social-icon.fb:hover svg {
            fill: #ffffff;
        }

        /* Instagram: Latar merah muda penuh + ikon putih */
        .social-icon.ig:hover {
            background-color: #E4405F;
            border-color: #E4405F;
        }
        .social-icon.ig:hover svg {
            fill: #ffffff;
        }

        /* YouTube: Latar merah penuh + ikon putih */
        .social-icon.yt:hover {
            background-color: #FF0000;
            border-color: #FF0000;
        }
        .social-icon.yt:hover svg {
            fill: #ffffff;
        }

        /* Twitter: Latar biru penuh + ikon putih */
        .social-icon.tw:hover {
            background-color: #1DA1F2;
            border-color: #1DA1F2;
        }
        .social-icon.tw:hover svg {
            fill: #ffffff;
        }

        /* ===== Footer ===== */
        footer {
            background-color: #333344;
            color: #ffffff;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 16px;
        }

        .footer-links a {
            color: #ffffff;
            text-decoration: none;
            margin-left: 24px;
        }
    </style>
</head>
