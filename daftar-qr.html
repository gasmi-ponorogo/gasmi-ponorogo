<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar QR Code GASMI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: 'Segoe UI', Arial, sans-serif; 
      padding: 30px 20px; 
      background: #f5f9f5; 
    }
    h1 { 
      text-align: center; 
      color: #0f4d2c; 
      margin-bottom: 25px;
      font-size: 26px;
    }
    .tombol-cetak {
      display: block;
      margin: 0 auto 30px;
      padding: 12px 35px;
      background: #2e8b57;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      font-weight: 600;
    }
    .tombol-cetak:hover { background: #247048; }
    .grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); 
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .kartu { 
      background: #fff; 
      padding: 20px 15px; 
      border-radius: 12px; 
      text-align: center; 
      box-shadow: 0 3px 10px rgba(0,80,40,0.12); 
      border: 2px solid #2e8b57;
    }
    .kartu img { margin: 10px 0; width: 130px; height: 130px; }
    .no-induk { 
      font-weight: bold; 
      color: #0f4d2c; 
      font-size: 15px;
      margin-top: 5px;
    }
    @media print {
      .tombol-cetak { display: none; }
      body { background: #fff; padding: 10px; }
      .kartu { box-shadow: none; page-break-inside: avoid; }
    }
  </style>
</head>
<body>

<h1>QR Code — Anggota GASMI Ranting Ponorogo</h1>

<button class="tombol-cetak" onclick="window.print()">🖨️ Cetak Semua QR Code</button>

<div class="grid" id="wadahQR"></div>

<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<script>
const dasarURL = "https://gasmi-ponorogo.github.io/gasmi-ponorogo/sertifikat.html?no_induk=";
const wadah = document.getElementById('wadahQR');

// Mulai membuat QR satu per satu
let nomor = 3352;
const nomorAkhir = 3582;

function buatBerikutnya() {
  if (nomor > nomorAkhir) return;

  const noInduk = "0" + nomor;
  const url = dasarURL + noInduk;

  const kartu = document.createElement('div');
  kartu.className = 'kartu';
  kartu.innerHTML = `
    <img id="qr-${nomor}" alt="QR ${noInduk}">
    <div class="no-induk">${noInduk}</div>
  `;
  wadah.appendChild(kartu);

  const img = document.getElementById(`qr-${nomor}`);
  QRCode.toDataURL(url, {
    width: 130,
    margin: 2,
    color: { dark: '#0f4d2c', light: '#ffffff' }
  }, function(err, dataUrl) {
    if (!err) {
      img.src = dataUrl;
      nomor++;
      buatBerikutnya(); // Lanjut ke nomor berikutnya
    } else {
      console.error('Gagal:', noInduk, err);
      nomor++;
      buatBerikutnya(); // Tetap lanjut walau ada kesalahan
    }
  });
}

// Mulai proses
buatBerikutnya();
</script>

</body>
</html>
