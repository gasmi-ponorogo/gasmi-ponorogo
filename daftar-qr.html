<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Siswa GASMI Ponorogo — Sistem QR</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f4f7f6; padding: 20px; }
        .container { max-width: 520px; margin: 0 auto; background: white; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); padding: 25px; }
        .header-top { text-align: center; margin-bottom: 20px; }
        .gasmi-logo { font-size: 26px; font-weight: bold; color: #2c3e50; }
        .gasmi-desc { color:#777; font-size:14px; margin-top:5px; }
        h2 { font-size: 18px; margin: 15px 0 10px; color: #34495e; }
        .search-box { width: 100%; padding: 12px 15px; border: 2px solid #ddd; border-radius: 10px; font-size: 15px; margin-bottom: 15px; }
        .student-list { max-height: 280px; overflow-y: auto; border: 1px solid #eee; border-radius: 10px; margin-bottom: 20px; }
        .student-item { padding: 10px 15px; border-bottom: 1px solid #f0f0f0; cursor: pointer; transition: background 0.2s; }
        .student-item:hover { background: #f8f9fa; }
        .student-no { font-weight: 600; color: #e63946; font-size: 14px; }
        .student-name { color: #2d3436; margin-left: 8px; font-size: 14px; }
        .card { border: 1px solid #e8e8e8; border-radius: 12px; padding: 22px; margin-top: 20px; background: #fefefe; display: none; }
        .card-title { text-align: center; font-weight: bold; font-size: 20px; color: #2c3e50; margin-bottom: 20px; }
        .row { display: flex; padding: 10px 0; border-bottom: 1px solid #eee; font-size: 14px; }
        .col-left { width: 38%; font-weight: 600; color: #555; }
        .col-right { width: 62%; color: #222; }
        .status { color: #27ae60; font-weight: bold; font-size: 15px; }
        .qr-section { margin-top: 25px; text-align: center; display: none; padding-top: 15px; border-top: 1px dashed #ddd; }
        #qrcode { margin: 15px auto; background: white; padding: 15px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .btn { padding: 12px 25px; background: #e63946; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 10px; width: 100%; }
        .btn:hover { background: #d62839; }
        .url-text { word-break: break-all; font-size: 11px; color: #16a085; margin-top: 10px; background: #e8f8f5; padding: 8px; border-radius: 6px; }
        .tanggal { font-size: 12px; color: #888; margin-top: 5px; }
        .no-data { text-align: center; padding: 20px; color: #999; }
        .back-link { display: inline-block; margin-top: 15px; color: #3498db; cursor: pointer; font-size: 14px; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="container" id="mainPage">
    <div class="header-top">
        <div class="gasmi-logo">GASMI</div>
        <p class="gasmi-desc">Ponorogo — Sistem Data Siswa & QR Code</p>
    </div>

    <h2>🔍 Cari Siswa</h2>
    <input type="text" id="searchInput" class="search-box" placeholder="Ketik No. Induk atau Nama...">
    
    <div class="student-list" id="studentList">
        <p class="no-data">Memuat data...</p>
    </div>

    <span class="back-link" id="backToList" style="display:none;" onclick="kembaliKeDaftar()">← Kembali ke daftar</span>

    <!-- Kartu Hasil / Tampilan Saat QR Dipindai -->
    <div class="card" id="resultCard">
        <div class="card-title">Data Siswa</div>
        
        <div class="row">
            <div class="col-left">No. Induk</div>
            <div class="col-right" id="dispNoInduk"></div>
        </div>
        <div class="row">
            <div class="col-left">Nama Lengkap</div>
            <div class="col-right" id="dispNama"></div>
        </div>
        <div class="row">
            <div class="col-left">Tempat, Tgl. Lahir</div>
            <div class="col-right" id="dispLahir"></div>
        </div>
        <div class="row">
            <div class="col-left">Jenis Kelamin</div>
            <div class="col-right" id="dispJK"></div>
        </div>
        <div class="row">
            <div class="col-left">Pendidikan</div>
            <div class="col-right" id="dispPendidikan"></div>
        </div>
        <div class="row">
            <div class="col-left">Nama Orang Tua</div>
            <div class="col-right" id="dispOrtu"></div>
        </div>
        <div class="row">
            <div class="col-left">Alamat Lengkap</div>
            <div class="col-right" id="dispAlamat"></div>
        </div>
        <div class="row">
            <div class="col-left">Status</div>
            <div class="col-right status">Terdaftar — Data Asli</div>
        </div>
        <div class="row" style="border-bottom:none;">
            <div class="col-left">Diperiksa</div>
            <div class="col-right tanggal" id="dispTanggal"></div>
        </div>

        <button class="btn" id="btnGenerateQR" onclick="buatQR()">📄 Buat Kode QR</button>

        <div class="qr-section" id="qrSection">
            <h3>✅ Kode QR Siap Digunakan</h3>
