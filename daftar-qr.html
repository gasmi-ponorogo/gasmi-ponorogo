<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar QR Code GASMI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: 'Segoe UI', Arial, sans-serif; 
      padding: 30px 20px; 
      background: #f5f9f5; 
    }
    h1 { 
      text-align: center; 
      color: #0f4d2c; 
      margin-bottom: 20px;
      font-size: 26px;
    }
    .status {
      text-align: center;
      color: #555;
      margin-bottom: 15px;
      font-weight: 500;
    }
    .tombol-cetak {
      display: block;
      margin: 0 auto 30px;
      padding: 12px 35px;
      background: #2e8b57;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      font-weight: 600;
    }
    .tombol-cetak:hover { background: #247048; }
    .grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); 
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .kartu { 
      background: #fff; 
      padding: 20px 15px; 
      border-radius: 12px; 
      text-align: center; 
      box-shadow: 0 3px 10px rgba(0,80,40,0.12); 
      border: 2px solid #2e8b57;
    }
    .kartu img { margin: 10px 0; width: 130px; height: 130px; }
    .no-induk { 
      font-weight: bold; 
      color: #0f4d2c; 
      font-size: 15px;
      margin-top: 5px;
    }
    @media print {
      .tombol-cetak, .status { display: none; }
      body { background: #fff; padding: 10px; }
      .kartu { box-shadow: none; page-break-inside: avoid; }
    }
  </style>
</head>
<body>

<h1>QR Code — Anggota GASMI Ranting Ponorogo</h1>
<div class="status" id="status">🔄 Memuat pustaka...</div>
<button class="tombol-cetak" onclick="window.print()">🖨️ Cetak Semua QR Code</button>
<div class="grid" id="wadahQR"></div>

<!-- GANTI SUMBER PUSTAKA → lebih cepat & stabil -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const dasarURL = "https://gasmi-ponorogo.github.io/gasmi-ponorogo/sertifikat.html?no_induk=";
const wadah = document.getElementById('wadahQR');
const status = document.getElementById('status');

function mulai() {
  if (typeof QRCode === 'undefined') {
    status.textContent = "⏳ Menunggu... (memuat ulang otomatis)";
    setTimeout(mulai, 250);
    return;
  }
  
  status.textContent = "✅ Mulai membuat QR...";

  let nomor = 3352;
  const nomorAkhir = 3582;

  function buatSatu() {
    if (nomor > nomorAkhir) {
      status.textContent = "✅ Selesai! Semua QR sudah muncul.";
      return;
    }

    const noInduk = "0" + nomor;
    const url = dasarURL + noInduk;

    const kartu = document.createElement('div');
    kartu.className = 'kartu';
    kartu.innerHTML = `
      <div id="qrc-${nomor}"></div>
      <div class="no-induk">${noInduk}</div>
    `;
    wadah.appendChild(kartu);

    new QRCode(document.getElementById(`qrc-${nomor}`), {
      text: url,
      width: 130,
      height: 130,
      colorDark: "#0f4d2c",
      colorLight: "#ffffff",
      correctLevel: 1
    });

    status.textContent = `📄 ${noInduk} — ${nomor - 3351}/${nomorAkhir - 3351}`;
    nomor++;
    setTimeout(buatSatu, 10);
  }

  buatSatu();
}

mulai();
</script>

</body>
</html>
