    h1 {font-size: 2rem; margin-bottom: 2rem;}
    .form-group {margin-bottom: 1.5rem;}
    label {display: block; margin-bottom: 0.5rem; font-weight: 500;}
    input {width: 100%; padding: 0.85rem 1rem; border: 1px solid #d1d5db; border-radius: 8px; font-size: 1rem;}
    button {background-color: #dc2626; color: white; border: none; padding: 0.85rem 2rem; font-size: 1rem; border-radius: 6px; cursor: pointer; font-weight: 600;}
    button:hover {background-color: #b91c1c;}
    .result {margin-top: 2rem; padding: 1.5rem; border-radius: 10px; background-color: #f9fafb; border-left: 4px solid #16a34a; display: none;}
    .not-found {border-left-color: #ef4444; background-color: #fef2f2;}
    .info-row {margin: 0.4rem 0;}
    .label {font-weight: 600; display: inline-block; min-width: 120px;}

  <button id="btnCari">Cari</button>

// Proses data
const daftar = dataSiswa.trim().split('\n').map(baris => {
  const [noInduk, nama, ttl, jk, pendidikkan, ortu, alamat] = baris.split('|');
  return { 
    noInduk: noInduk.trim(), 
    nama: nama.trim(), 
    ttl: ttl.trim(), 
    jk: jk.trim(), 
    pendidikkan: pendidikkan.trim(), 
    ortu: ortu.trim(), 
    alamat: alamat.trim() 
  };
});

// Elemen
const elNoInduk = document.getElementById('noInduk');
const elNamaOrtu = document.getElementById('namaOrtu');
const btnCari = document.getElementById('btnCari');
const elHasil = document.getElementById('hasil');

// Fungsi cari
function cari() {
  const kataInduk = elNoInduk.value.trim();
  const kataOrtu = elNamaOrtu.value.trim().toLowerCase();
  
  elHasil.style.display = 'none';
  elHasil.classList.remove('not-found');

  if (!kataInduk && !kataOrtu) {
    alert('Masukkan Nomor Induk atau Nama Orang Tua');
    return;
  }

  const ditemukan = daftar.filter(s => {
    const cocokInduk = !kataInduk || s.noInduk === kataInduk;
    const cocokOrtu = !kataOrtu || s.ortu.toLowerCase().includes(kataOrtu);
    return cocokInduk && cocokOrtu;
  });

  if (ditemukan.length === 0) {
    elHasil.style.display = 'block';
    elHasil.classList.add('not-found');
    elHasil.innerHTML = '<strong>Data tidak ditemukan.</strong><br>Cek kembali Nomor Induk dan Nama Orang Tua.<br>Contoh: Nomor Induk <b>03352-19-09</b>, Nama Ortu <b>Mesnan / Dati</b>';
    return;
  }

  const d = ditemukan[0];
  document.getElementById('rNoInduk').textContent = d.noInduk;
  document.getElementById('rNama').textContent = d.nama;
  document.getElementById('rTtl').textContent = d.ttl;
  document.getElementById('rJk').textContent = d.jk;
  document.getElementById('rPendidikan').textContent = d.pendidikkan;
  document.getElementById('rOrtu').textContent = d.ortu;
  document.getElementById('rAlamat').textContent = d.alamat;
  
  elHasil.style.display = 'block';
}

btnCari.addEventListener('click', cari);
elNoInduk.addEventListener('keydown', e => e.key === 'Enter' && cari());
elNamaOrtu.addEventListener('keydown', e => e.key === 'Enter' && cari());
