<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pencarian Sertifikat Gasmi</title>
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            line-height: 1.6;
            color: #333;
            background-color: #fff;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            border-bottom: 1px solid #eee;
        }
        .menu-icon { font-size: 1.5rem; cursor: pointer; }
        .logo { font-size: 1.8rem; font-weight: bold; color: #000; }
        .hubungi-kami { color: #d32f2f; text-decoration: none; font-weight: 500; }
        .container { max-width: 600px; margin: 3rem auto; padding: 0 2rem; }
        h1 { text-align: center; margin-bottom: 2.5rem; color: #222; }
        .form-group { margin-bottom: 1.5rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: 500; }
        input {
            width: 100%;
            padding: 0.9rem;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
        }
        input:focus {
            outline: none;
            border-color: #d32f2f;
            box-shadow: 0 0 0 2px rgba(211, 47, 47, 0.2);
        }
        .recaptcha-container { margin: 1.5rem 0; }
        .btn-cari {
            width: 100%;
            padding: 1rem;
            background-color: #d32f2f;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .btn-cari:hover { background-color: #b71c1c; }
        .btn-cari:disabled { background-color: #ef9a9a; cursor: not-allowed; }
        .hasil {
            margin-top: 2rem;
            padding: 1.5rem;
            border-radius: 8px;
            display: none;
        }
        .hasil.sukses { background-color: #e8f5e9; border: 1px solid #4caf50; }
        .hasil.error { background-color: #ffebee; border: 1px solid #ef5350; }
        .info-row { margin: 0.5rem 0; }
        .label { font-weight: 600; display: inline-block; min-width: 140px; }
        .pesan-kesalahan {
            color: #d32f2f;
            margin-top: 0.5rem;
            font-size: 0.9rem;
            display: none;
        }
    </style>
</head>
<body>
    <header>
        <div class="menu-icon">☰</div>
        <div class="logo">Gasmi</div>
        <a href="#" class="hubungi-kami">Hubungi Kami</a>
    </header>

    <main class="container">
        <h1>Pencarian Sertifikat Gasmi</h1>
        
        <form id="formPencarian">
            <div class="form-group">
                <label for="nomorInduk">Silakan Masukkan Nomor Induk</label>
                <input type="text" id="nomorInduk" placeholder="Contoh: 03352-19-09" required>
                <div class="pesan-kesalahan" id="errNomor"></div>
            </div>

            <div class="form-group">
                <label for="namaOrangtua">Silakan Masukkan Nama Orangtua</label>
                <input type="text" id="namaOrangtua" placeholder="Contoh: Mesnan / Dati" required>
            </div>

            <div class="recaptcha-container">
                <div class="g-recaptcha" 
                   data-sitekey="6LftMsctAAAAALrwQzTBpJujtr-o3iE7y7TpIViN">
                </div>
            </div>

            <button type="submit" class="btn-cari" id="btnCari">Cari</button>
        </form>

        <div class="hasil" id="kotakHasil">
            <h3 id="judulHasil"></h3>
            <div id="isiHasil"></div>
        </div>
    </main>

    <script>
        // --- DATA SISWA — Tambahkan data asli di sini ---
        const dataSiswa = [
            {
                nomorInduk: "03552-19-09",
                namaOrangtua: "Mesnan / Dati",
                namaSiswa: "Nama Siswa Contoh",
                program: "Gasmi Ponorogo",
                tanggalTerbit: "2026-09-21",
                nomorSertifikat: "GASMI-PO-2026-0987"
            }
            // Tambahkan format:
            // ,{
            //     nomorInduk: "nomorAnda",
            //     namaOrangtua: "Nama / Ayah",
            //     namaSiswa: "Nama Lengkap Siswa",
            //     program: "Gasmi Ponorogo",
            //     tanggalTerbit: "2026-09-21",
            //     nomorSertifikat: "GASMI-PO-xxxx-xxxxx"
            // }
        ];

        const form = document.getElementById('formPencarian');
        const btnCari = document.getElementById('btnCari');
        const kotakHasil = document.getElementById('kotakHasil');
        const isiHasil = document.getElementById('isiHasil');
        const judulHasil = document.getElementById('judulHasil');
        const errNomor = document.getElementById('errNomor');

        function validasiNomorInduk(nomor) {
            const pola = /^\d{5}-\d{2}-\d{2}$/;
            return pola.test(nomor);
        }

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            kotakHasil.style.display = 'none';
            errNomor.style.display = 'none';

            const nomorInduk = document.getElementById('nomorInduk').value.trim();
            const namaOrangtua = document.getElementById('namaOrangtua').value.trim();
            const recaptchaResponse = grecaptcha.getResponse();

            if (!validasiNomorInduk(nomorInduk)) {
                errNomor.textContent = 'Format salah. Gunakan: 03352-19-09';
                errNomor.style.display = 'block';
                return;
            }

            if (!recaptchaResponse) {
                alert('Silakan centang "Saya bukan robot" terlebih dahulu');
                return;
            }

            btnCari.disabled = true;
            btnCari.textContent = 'Mencari...';

            const hasil = dataSiswa.find(s => 
                s.nomorInduk === nomorInduk && 
                s.namaOrangtua.toLowerCase() === namaOrangtua.toLowerCase()
            );

            setTimeout(() => {
                if (hasil) {
                    kotakHasil.className = 'hasil sukses';
                    judulHasil.textContent = '✅ Data Ditemukan';
                    isiHasil.innerHTML = `
                        <div class="info-row"><span class="label">Nomor Induk:</span> ${hasil.nomorInduk}</div>
                        <div class="info-row"><span class="label">Nama Orangtua:</span> ${hasil.namaOrangtua}</div>
                        <div class="info-row"><span class="label">Nama Siswa:</span> ${hasil.namaSiswa}</div>
                        <div class="info-row"><span class="label">Program:</span> ${hasil.program}</div>
                        <div class="info-row"><span class="label">Nomor Sertifikat:</span> ${hasil.nomorSertifikat}</div>
                        <div class="info-row"><span class="label">Tanggal Terbit:</span> ${hasil.tanggalTerbit}</div>
                    `;
                } else {
                    kotakHasil.className = 'hasil error';
                    judulHasil.textContent = '❌ Data Tidak Ditemukan';
                    isiHasil.innerHTML = `<p>Pastikan Nomor Induk & Nama Orangtua sesuai dokumen.</p>`;
                }
                kotakHasil.style.display = 'block';
                btnCari.disabled = false;
                btnCari.textContent = 'Cari';
                grecaptcha.reset();
            }, 600);
        });
    </script>
</body>
</html>
