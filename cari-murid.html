<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

    <title>Pencarian Sertifikat Gasmi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            color: #333;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            padding: 1rem 2rem;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            color: #222;
        }
        .hubungi-kami {
            color: #d32f2f;
            text-decoration: none;
            font-weight: 500;
        }
        main {
            flex: 1;
            max-width: 600px;
            width: 90%;
            margin: 3rem auto;
            padding: 0 1rem;
        }
        h1 {
            text-align: center;
            color: #222;
            margin-bottom: 2.5rem;
            font-size: 2rem;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #555;
        }
        input {
            width: 100%;
            padding: 0.9rem 1rem;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #d32f2f;
        }
        .captcha-box {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            margin: 1.5rem 0;
            padding: 1rem;
            background: #f9f9f9;
            border-radius: 6px;
        }
        .captcha-box input[type="checkbox"] {
            width: auto;
            transform: scale(1.2);
        }
        .btn-cari {
            width: 100%;
            padding: 1rem;
            background-color: #d32f2f;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .btn-cari:hover {
            background-color: #b71c1c;
        }
        .hasil {
            margin-top: 2rem;
            padding: 1.5rem;
            border-radius: 8px;
            display: none;
        }
        .hasil.ada {
            background-color: #e8f5e9;
            border: 1px solid #c8e6c9;
            display: block;
        }
        .hasil.tidak-ada {
            background-color: #ffebee;
            border: 1px solid #ffcdd2;
            display: block;
        }
        .hasil h3 {
            margin-bottom: 1rem;
            color: #2e7d32;
        }
        .hasil.tidak-ada h3 {
            color: #c62828;
        }
        .data-row {
            padding: 0.5rem 0;
            border-bottom: 1px dashed #ddd;
        }
        .data-row:last-child {
            border-bottom: none;
        }
        .label {
            font-weight: 600;
            display: inline-block;
            min-width: 140px;
        }
        .menu-btn {
            position: absolute;
            top: 1.2rem;
            left: 1.5rem;
            font-size: 1.5rem;
            background: none;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

    <button class="menu-btn" title="Menu">☰</button>

    <main>

        <form id="formCari">

                <label for="nomorInduk">Silakan Masukkan Nomor Induk</label>
                <input type="text" id="nomorInduk" placeholder="Contoh: 03352-19-09" required>
            </div>

            <div class="form-group">
                <label for="namaOrangtua">Silakan Masukkan Nama Orangtua</label>
                <input type="text" id="namaOrangtua" placeholder="Contoh: Mesnan / Dati" required>
            </div>

            <div class="captcha-box">
                <input type="checkbox" id="bukanRobot" required>
                <label for="bukanRobot">Saya bukan robot</label>
                <small style="margin-left: auto; color: #666;">reCAPTCHA mengubah persyaratan layanannya. Ambil tindakan.</small>
            </div>

            <button type="submit" class="btn-cari">Cari</button>
        </form>

        <div id="hasilPencarian" class="hasil">
            <h3 id="judulHasil"></h3>
            <div id="isiHasil"></div>
        </div>
    </main>
