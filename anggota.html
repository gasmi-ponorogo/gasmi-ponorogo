<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Anggota GASMI</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #f5f9f5;
      padding: 2rem;
      line-height: 1.6;
    }
    .header-kartu {
      text-align: center;
      margin-bottom: 2rem;
      color: #0f4d2c;
    }
    .header-kartu h2 {
      font-size: 1.8rem;
      margin-bottom: 0.3rem;
    }
    .header-kartu p {
      color: #555;
      font-size: 1rem;
    }
    .kartu-data {
      max-width: 500px;
      margin: 0 auto;
      background: #fff;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 12px rgba(0,80,40,0.1);
      border: 2px solid #2e8b57;
    }
    .kartu-data h2 {
      text-align: center;
      color: #0f4d2c;
      margin-bottom: 1rem;
    }
    .kartu-data hr {
      border: none;
      border-top: 1px dashed #2e8b57;
      margin: 1rem 0;
    }
    .kartu-data p {
      margin: 0.7rem 0;
    }
    .kartu-data strong {
      display: inline-block;
      min-width: 160px;
      color: #0f4d2c;
    }
    .loading, .pesan-error {
      text-align: center;
      font-size: 1.1rem;
      padding: 2rem;
    }
    .pesan-error {
      color: #c0392b;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="header-kartu">
    <h2>PENCAK SILAT GASMI</h2>
    <p>Ranting Ponorogo — Dokumen Data Anggota Resmi</p>
  </div>

  <div id="konten-siswa">
    <p class="loading">Memuat data...</p>
  </div>

<script>
// === GANTI URL DI BAWAH DENGAN URL Web App Google Apps Script ANDA ===
const API_URL = 'https://script.google.com/macros/s/AKfycbyzSHB9kBcbOqi1urwRQZjJKcDLiwUmTtabicc-9ALJ61vbpMzhyxDluRU2xTX0Dv5JtjQ/exec';
// =====================================================================

const urlParams = new URLSearchParams(window.location.search);
const idQuery = urlParams.get('id');
const wadahKonten = document.getElementById('konten-siswa');

if (!idQuery) {
  wadahKonten.innerHTML = '<p class="pesan-error">QR Code Tidak Valid! Parameter ID dibutuhkan.</p>';
} else {
  fetch(API_URL)
    .then(res => {
      if (!res.ok) throw new Error(`Respons gagal: ${res.status}`);
      return res.json();
    })
    .then(data => {
      if (!Array.isArray(data)) throw new Error("Format data tidak sesuai");
      
      const dicari = idQuery.trim();
      const siswa = data.find(s => s.id === dicari);
      
      if (siswa) {
        wadahKonten.innerHTML = `
          <div class="kartu-data">
            <h2>${siswa.nama}</h2>
            <hr>
            <p><strong>ID Anggota:</strong> ${siswa.id}</p>
            <p><strong>No. Induk:</strong> ${siswa.no_induk || '-'}</p>
            <p><strong>Tempat, Tanggal Lahir:</strong> ${siswa.ttl || '-'}</p>
            <p><strong>Jenis Kelamin:</strong> ${siswa.jk || '-'}</p>
            <p><strong>Pendidikan:</strong> ${siswa.pendidikan || '-'}</p>
            <p><strong>Nama Orang Tua:</strong> ${siswa.ortu || '-'}</p>
            <p><strong>Alamat:</strong> ${siswa.alamat || '-'}</p>
          </div>
        `;
      } else {
        wadahKonten.innerHTML = `<p class="pesan-error">Data Anggota ID ${idQuery} Tidak Ditemukan!</p>`;
      }
    })
    .catch(err => {
      wadahKonten.innerHTML = `<p class="pesan-error">Gagal memuat: ${err.message}</p>`;
    });
}
</script>

</body>
</html>
