<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sertifikat GASMI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      background: #f8f7fc;
      color: #333;
      padding: 30px 20px;
      max-width: 500px;
      margin: 0 auto;
    }
    .judul-atas {
      text-align: center;
      font-size: 36px;
      font-weight: bold;
      color: #111;
      margin-bottom: 30px;
    }
    .kartu {
      background: #ffffff;
      border-radius: 20px;
      padding: 35px 25px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
    }
    .judul-hasil {
      text-align: center;
      font-size: 30px;
      font-weight: bold;
      color: #111;
      margin-bottom: 30px;
    }
    .baris {
      display: flex;
      padding: 14px 0;
      border-bottom: 1px solid #eee;
      align-items: center;
    }
    .kiri {
      width: 45%;
      font-size: 18px;
      color: #666;
      line-height: 1.5;
    }
    .kanan {
      width: 55%;
      font-size: 18px;
      color: #222;
      line-height: 1.5;
    }
    .status-hijau {
      color: #28a745;
      font-weight: bold;
      font-size: 22px;
    }
    .tgl-bawah {
      margin-top: 25px;
      text-align: center;
      color: #999;
      font-size: 16px;
    }
    .footer {
      text-align: center;
      margin-top: 30px;
      color: #555;
      font-size: 17px;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="judul-atas">GASMI</div>

  <div class="kartu">
    <div class="judul-hasil">Hasil Pencarian: <span id="no-pencarian"></span></div>

    <div class="baris">
      <div class="kiri">Nomor Induk</div>
      <div class="kanan" id="no-induk"></div>
    </div>

    <div class="baris">
      <div class="kiri">Nama Lengkap</div>
      <div class="kanan" id="nama"></div>
    </div>

    <div class="baris">
      <div class="kiri">Tempat, Tanggal Lahir</div>
      <div class="kanan" id="ttl"></div>
    </div>

    <div class="baris">
      <div class="kiri">Pendidikan / Jenis Kelamin</div>
      <div class="kanan" id="pendidikan"></div>
    </div>

    <div class="baris">
      <div class="kiri">Status Sertifikat</div>
      <div class="kanan status-hijau">ASLI</div>
    </div>

    <div class="tgl-bawah" id="tgl-cetak"></div>
  </div>

  <div class="footer">GASMI — Cabang Ponorogo</div>

<script>
const urlParams = new URLSearchParams(window.location.search);
const noInduk = urlParams.get('no_induk') || '00000';

document.getElementById('no-pencarian').textContent = noInduk;
document.getElementById('no-induk').textContent = noInduk;

// Isi data — nanti diganti data asli
document.getElementById('nama').textContent = noInduk;
document.getElementById('ttl').textContent = 'Trenggalek, 23 Agustus 2005';
document.getElementById('pendidikan').textContent = 'Perempuan';

const hariIni = new Date();
document.getElementById('tgl-cetak').textContent =
  'Tanggal Pencarian: ' + hariIni.toLocaleDateString('id-ID', {
    day: 'numeric',
    month: 'long',
    year: 'numeric'
  });
</script>

</body>
</html>
