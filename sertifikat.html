<html lang="id">
<head>

    <link href="https://googleapis.com" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #f8f9fa;
            color: #333333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Top Navigation Header Bar */
        .navbar {
            background-color: #ffffff;
            border-bottom: 1px solid #e9ecef;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .menu-icon {
            font-size: 20px;
            cursor: pointer;
            color: #495057;
        }

        .brand-name {
            font-size: 22px;
            font-weight: 700;
            color: #2b3044;
        }

        .hubungi-kami {
            color: #dc3545;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
        }

        /* Main Container */
        .container {
            max-width: 500px;
            width: 100%;
            margin: 0 auto;
            padding: 25px 20px;
            flex: 1;
        }

        .page-title {
            font-size: 24px;
            font-weight: 700;
            color: #2b3044;
            margin-bottom: 25px;
            text-align: left;
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #6c757d;
            margin-bottom: 8px;
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            font-size: 16px;
            border: 1px solid #ced4da;
            border-radius: 8px;
            background-color: #ffffff;
            transition: border-color 0.15s ease-in-out;
            color: #2b3044;
        }

        .form-control:focus {
            outline: none;
            border-color: #dc3545;
            box-shadow: 0 0 0 3px rgba(220, 53, 69, 0.1);
        }

        /* Custom Fake reCAPTCHA Widget Box */
        .recaptcha-box {
            background-color: #f9f9f9;
            border: 1px solid #d3d3d3;
            border-radius: 3px;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 25px;
        }

        .recaptcha-left {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }

        .checkbox-custom {
            width: 24px;
            height: 24px;
            border: 2px solid #c1c1c1;
            border-radius: 2px;
            background-color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .checkbox-custom.checked {
            border-color: #04b74a;
            background-color: #fff;
        }

        .checkbox-custom .check-mark {
            display: none;
            width: 6px;
            height: 12px;
            border: solid #04b74a;
            border-width: 0 3px 3px 0;
            transform: rotate(45deg);
            margin-bottom: 2px;
        }

        .checkbox-custom.checked .check-mark {
            display: block;
        }

        .recaptcha-text {
            font-size: 13px;
            color: #000000;
            font-weight: 400;
        }

        .recaptcha-right {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .recaptcha-logo {
            width: 32px;
            height: 32px;
            background: url('https://gstatic.com') no-repeat;
            background-size: contain;
        }

        .recaptcha-privacy {
            font-size: 8px;
            color: #555;
            text-decoration: none;
            margin-top: 2px;
        }

        /* Action Buttons */
        .btn-cari {
            background-color: #dc3545;
            color: #ffffff;
            border: none;
            padding: 12px 28px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-bottom: 30px;
        }

        .btn-cari:hover {
            background-color: #bd2130;
        }

        /* Search Results Panel Container */
        .result-card {
            display: none;
            background: #ffffff;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02), 0 1px 3px rgba(0,0,0,0.05);
            border: 1px solid #e9ecef;
            position: relative;
            overflow: hidden;
            margin-bottom: 40px;
        }

        /* Watermark Background Garuda/Gasmi */
        .result-card::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 260px;
            height: 260px;
            background: url('https://wikimedia.org') no-repeat center;
            background-size: contain;
            opacity: 0.04;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .result-header {
            font-size: 16px;
            font-weight: 700;
            color: #2b3044;
            padding-bottom: 15px;
            border-bottom: 1px solid #f1f3f5;
            margin-bottom: 15px;
        }

        .info-row {
            display: flex;
            padding: 10px 0;
            border-bottom: 1px solid #f8f9fa;
            font-size: 15px;
            align-items: flex-start;
        }

        .info-label {
            width: 35%;
            color: #6c757d;
            font-weight: 500;
        }

        .info-value {
            width: 65%;
            color: #2b3044;
            font-weight: 600;
            word-break: break-word;
        }

        .status-badge {
            color: #04b74a;
            font-weight: 700;
        }

        .error-message {
            display: none;
            background-color: #fff5f5;
            color: #e53e3e;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #fed7d7;
            font-weight: 500;
            margin-bottom: 30px;
            font-size: 14px;
        }

        /* Footer Hubungi Kami Section */
        .footer-info {
            background-color: #fdfdfd;
            border-top: 1px solid #e9ecef;
            padding: 30px 20px;
            text-align: left;
        }

        .footer-brand {
            font-size: 20px;
            font-weight: 700;
            color: #2b3044;
            margin-bottom: 15px;
        }

        .footer-address {
            font-size: 14px;
            color: #495057;
            line-height: 1.6;
            margin-bottom: 20px;
            max-width: 450px;
        }

        .footer-title {
            font-size: 16px;
            font-weight: 700;
            color: #2b3044;
            margin-bottom: 10px;
        }

        .footer-contact-item {
            font-size: 14px;
            color: #495057;
            margin-bottom: 8px;
        }

        .footer-social-section {
            margin-top: 25px;
        }

        .footer-social-section p {
            font-size: 14px;
            color: #495057;
            margin-bottom: 12px;
            font-weight: 500;
        }

        .social-icons {
            display: flex;
            gap: 12px;
        }

        .social-btn {
            width: 42px;
            height: 42px;
            border-radius: 8px;
            border: 1px solid #dee2e6;
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #495057;
            text-decoration: none;
            font-size: 16px;
            transition: all 0.2s;
        }

        .social-btn:hover {
            background-color: #f1f3f5;
            color: #dc3545;
        }

        /* Bottom Dark Footer Navbar */
        .bottom-nav {
            background-color: #2b3044;
            color: #ffffff;
            padding: 20px;
            text-align: center;
            position: relative;
        }

        .bottom-links {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .bottom-links a {
            color: #ffffff;
            text-decoration: none;
            opacity: 0.8;
        }

        .bottom-links a:hover {
            opacity: 1;
        }

        .copyright {
            font-size: 12px;
            opacity: 0.6;
        }
